<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservation | 喫茶 綴ル</title>
    <meta name="description" content="喫茶 綴ルの読書探訪イベント予約・お問い合わせページです。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/ress.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="header-inner inner">
        <h1 class="logo"><a href="index.html">喫茶 綴ル</a></h1>

        <nav class="gnav" aria-label="グローバルナビゲーション">
          <ul class="gnav-list">
            <li><a href="about.html">About</a></li>
            <li><a href="coffee.html">Coffee</a></li>
            <li><a href="books.html">Books</a></li>
            <li><a href="event.html">Event</a></li>
            <li><a href="access.html">Access</a></li>
            <li class="gnav-contact"><a class="button button-small" href="reservation.html">お問い合わせ</a></li>
          </ul>
        </nav>

        <button class="hamburger" type="button" aria-label="メニューを開く" aria-controls="global-navigation" aria-expanded="false">
          <span></span>
        </button>
      </div>
      <div class="bg-btn"></div>
    </header>
    <main>
      <section class="page-mv">
        <h2 class="page-title-en">Reservation</h2>
        <p class="page-title-ja">イベント予約・お問い合わせ</p>
      </section>

      <section class="section">
        <div class="inner">
          <p class="lead">
            読書探訪イベントへの参加予約、または店舗へのお問い合わせはこちらからお願いいたします。
          </p>

          <form class="contact-form" action="#" method="post">
            <div class="form-item">
              <label for="name">お名前</label>
              <input type="text" id="name" name="name" placeholder="例：山田 太郎" />
            </div>

            <div class="form-item">
              <label for="email">メールアドレス</label>
              <input type="email" id="email" name="email" placeholder="example@example.com" />
            </div>

            <div class="form-item">
              <label for="type">お問い合わせ種別</label>
              <select id="type" name="type">
                <option value="">選択してください</option>
                <option value="event">読書探訪イベント予約</option>
                <option value="shop">店舗へのお問い合わせ</option>
              </select>
            </div>

            <div class="form-item">
              <label for="message">お問い合わせ内容</label>
              <textarea id="message" name="message" placeholder="お問い合わせ内容をご入力ください"></textarea>
            </div>

            <button class="button" type="submit">送信する</button>
          </form>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="inner footer-inner">
        <p class="footer-logo">喫茶 綴ル</p>
        <p class="footer-text">Coffee, Books, and Quiet Time</p>
        <p><small>&copy; 喫茶 綴ル</small></p>
      </div>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact｜喫茶 綴ル</title>
  <meta name="description" content="お問い合わせ・イベント予約。喫茶 綴ルへのご連絡はこちらから。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">喫茶 綴ル</a>
      <nav class="site-nav" aria-label="メインメニュー">
        <ul class="nav-list" id="navList">
          <li><a href="about.html">About</a></li>
          <li><a href="coffee.html">Coffee</a></li>
          <li><a href="books.html">Books</a></li>
          <li><a href="event.html">Events</a></li>
          <li><a href="access.html">Access</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="contact.html" class="btn btn-sm" aria-current="page">お問い合わせ</a>
        <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false" aria-controls="navList">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="container section">
      <div class="section-head">
        <h1 class="section-title">Contact</h1>
        <p class="section-sub">お問い合わせ・イベント予約</p>
      </div>

      <!-- ※このフォームは静的サイトのため、このままでは送信されません。
           実際に送るにはバックエンド or フォームサービス（Formspree等）が必要。 -->
      <form class="contact-form" action="#" method="post" novalidate>
        <p class="form-note">読書会の予約、店内のご利用、その他のご相談など、お気軽にどうぞ。</p>

        <div class="form-row">
          <label for="type">ご用件<span class="req">必須</span></label>
          <select id="type" name="type" required>
            <option value="">選択してください</option>
            <option value="inquiry">お問い合わせ</option>
            <option value="reservation">イベント予約</option>
          </select>
        </div>

        <div class="form-row">
          <label for="name">お名前<span class="req">必須</span></label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>

        <div class="form-row">
          <label for="email">メールアドレス<span class="req">必須</span></label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-row">
          <label for="guests">参加人数（予約の場合）</label>
          <input type="number" id="guests" name="guests" min="1" max="10">
        </div>

        <div class="form-row">
          <label for="message">メッセージ</label>
          <textarea id="message" name="message"></textarea>
        </div>

        <div class="form-submit">
          <button type="submit" class="btn btn-primary">送信する</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-logo">喫茶 綴ル</p>
      <p class="footer-info">営業時間 10:00–19:00（火曜定休）<br>〒000-0000 東京都〇〇区〇〇1-2-3</p>
      <nav class="footer-nav" aria-label="フッターメニュー">
        <a href="about.html">About</a>
        <a href="coffee.html">Coffee</a>
        <a href="books.html">Books</a>
        <a href="event.html">Events</a>
        <a href="access.html">Access</a>
        <a href="contact.html">Contact</a>
      </nav>
      <p class="copyright">© 2026 喫茶 綴ル</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>

<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="本とコーヒーの時間。オーナー厳選の書籍と、本に合う一杯の提案。"
    />

  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo">
          <span class="logo-mark" aria-hidden="true"></span>
          <span class="logo-text">喫茶 綴ル</span>
        </a>
        <nav class="site-nav" aria-label="メインメニュー">
          <ul class="nav-list" id="navList">
            <li><a href="about.html">About</a></li>
            <li><a href="coffee.html">Coffee</a></li>
            <li><a href="books.html" aria-current="page">Books</a></li>
            <li><a href="event.html">Events</a></li>
            <li><a href="access.html">Access</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a href="contact.html" class="btn btn-sm">お問い合わせ</a>
          <button
            class="hamburger"
            id="hamburger"
            aria-label="メニューを開く"
            aria-expanded="false"
            aria-controls="navList"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="container section">
        <div class="section-head">
          <h1 class="section-title">Books</h1>
          <p class="section-sub">本とコーヒーの時間</p>
        </div>

        <!-- オーナー厳選の書籍 -->
        <h2
          style="
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
          "
        >
          オーナー厳選の書籍
        </h2>
        <div class="book-grid">
          <img src="img/books-shisakunotebiki.png" alt="書籍『思索の手引き』" />
          <img src="img/books-madobenoakari.png" alt="書籍『窓辺の灯り』" />
          <img
            src="img/books-yorunodokusyosanpo.png"
            alt="書籍『夜の読書散歩』"
          />
        </div>
        <p style="text-align: center">
          <a href="#" class="btn btn-sm">書籍一覧を見る</a>
        </p>

        <!-- おすすめセット提案 -->
        <h2
          style="
            font-family: var(--font-heading);
            font-size: 1.3rem;
            margin: 3rem 0 1.5rem;
          "
        >
          おすすめセット提案
        </h2>
        <div class="pairing">
          <img src="img/books-kotobatokodoku.png" alt="書籍『ことばと孤独』" />
          <span class="x">×</span>
          <div>
            <p style="font-family: var(--font-heading); font-size: 1.1rem">
              「この本ならこのコーヒー」
            </p>
            <p style="font-size: 0.9rem; color: var(--color-sub)">
              深煎りブレンド
            </p>
          </div>
          <a href="coffee.html" class="btn btn-sm">Coffeeへ</a>
        </div>
      </section>
    </main>

    <!-- ============ 共通フッター ============ -->

        <p class="footer-logo">喫茶 綴ル</p>
        <p class="footer-info">

          <span><a href="tel:0300000000">TEL 03-0000-0000</a></span
          ><br />
          <span>〒110-0001 東京都台東区谷中</span>
        </p>

          <li>
            <a href="#" aria-label="Instagram">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"

                <circle cx="12" cy="12" r="4" />
                <circle
                  cx="17.5"
                  cy="6.5"
                  r="1"
                  fill="currentColor"
                  stroke="none"

          <a href="about.html">About</a>
          <a href="coffee.html">Coffee</a>

        </div>

    </header>

    <main>
      <section class="container section">
        <div class="section-head">
          <h1 class="section-title">Contact</h1>
          <p class="section-sub">お問い合わせ・イベント予約</p>
        </div>

        <!-- ※このフォームは静的サイトのため、このままでは送信されない。
            実際に送るにはバックエンド or フォームサービス（Formspree等）が必要。 -->
        <form class="contact-form" action="#" method="post" novalidate>
          <p class="form-note">
            読書会の予約、店内のご利用、その他のご相談など、お気軽にどうぞ。
          </p>

          <div class="form-row">
            <label for="type">ご用件<span class="req">必須</span></label>
            <select id="type" name="type" required>
              <option value="">選択してください</option>
              <option value="inquiry">お問い合わせ</option>
              <option value="reservation">イベント予約</option>
            </select>
          </div>

          <div class="form-row">
            <label for="name">お名前<span class="req">必須</span></label>
            <input
              type="text"
              id="name"
              name="name"
              required
              autocomplete="name"
            />
          </div>

          <div class="form-row">
            <label for="email"
              >メールアドレス<span class="req">必須</span></label
            >
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-row">
            <label for="guests">参加人数（予約の場合）</label>
            <input type="number" id="guests" name="guests" min="1" max="10" />
          </div>

          <div class="form-row">
            <label for="message">メッセージ</label>
            <textarea id="message" name="message"></textarea>
          </div>

          <div class="form-submit">
            <button type="submit" class="btn btn-primary">送信する</button>
          </div>
        </form>
      </section>
    </main>
